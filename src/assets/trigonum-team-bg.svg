      <stop offset="0" stop-color="#010207"/>
      <stop offset=".48" stop-color="#071124"/>
      <stop offset="1" stop-color="#090414"/>
    </linearGradient>
    <linearGradient id="mountain" x1="0" y1="0" x2="1" y2="1">
